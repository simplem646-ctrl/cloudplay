<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title><!--TITLE--></title>
<style>
  :root { --bg: #17121f; --fg: #f4ead5; --accent: #f2b84b; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #app canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #boot { position: absolute; font-size: 14px; opacity: .7; letter-spacing: .05em; }
</style>
</head>
<body>
<div id="app"><div id="boot">Loading&hellip;</div></div>

</body>
</html>
