<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Lab - Lanternbrook Days</title>
<style>
  :root { --bg:#1d1a24; --panel:#2a2634; --ink:#f1e9dc; --dim:#a79fb4; --acc:#f2b45a; --ok:#7fd49a; --bad:#ef7a7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; padding:12px 16px 40px; }
  h1 { font-size:18px; margin:0 0 8px; }
  h2 { font-size:14px; margin:18px 0 6px; color:var(--acc); text-transform:uppercase; letter-spacing:.06em; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:var(--panel); padding:8px 10px; border-radius:8px; position:sticky; top:0; z-index:2; }
  canvas { background:#14121a; border-radius:6px; width:260px; height:48px; }
  button { background:#3b3548; color:var(--ink); border:1px solid #514a62; border-radius:6px; padding:4px 9px; cursor:pointer; font:inherit; }
  button:hover { background:#4a4359; } button.on { background:var(--acc); color:#241c10; border-color:var(--acc); }
  .grid { display:flex; flex-wrap:wrap; gap:6px; }
  label { color:var(--dim); font-size:12px; } input[type=range] { width:90px; vertical-align:middle; }
  table { border-collapse:collapse; margin-top:6px; width:100%; max-width:980px; } td, th { padding:2px 8px; text-align:right; font-variant-numeric:tabular-nums; border-bottom:1px solid #342f40; }
  td:first-child, th:first-child { text-align:left; } .ok { color:var(--ok); } .bad { color:var(--bad); }
  #status { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<h1>Audio Lab <small id="status"></small></h1>
<div class="bar">
  <button id="unlock">Enable audio</button>
  <button id="stop">Stop music</button>
  <button id="mute">Mute</button>
  <canvas id="viz" width="520" height="96"></canvas>
  <label>master <input type="range" id="v-master" min="0" max="1" step="0.01" value="0.9"></label>
  <label>music <input type="range" id="v-music" min="0" max="1" step="0.01" value="0.7"></label>
  <label>sfx <input type="range" id="v-sfx" min="0" max="1" step="0.01" value="0.9"></label>
  <label>ambience <input type="range" id="v-ambience" min="0" max="1" step="0.01" value="0.6"></label>
</div>
<h2>Music</h2><div class="grid" id="music"></div>
<h2>SFX</h2><div class="grid" id="sfx"></div>
<h2>Voice blips</h2><div class="grid" id="voices"></div>
<h2>Footsteps</h2><div class="grid" id="steps"></div>
<h2>Ambience</h2>
<div class="grid" id="amb"></div>
<div class="grid" id="ambpresets" style="margin-top:6px"></div>
<h2>Offline analysis</h2>
<div><button id="runtest">Run offline analysis</button> <span id="progress" class="dim"></span></div>
<div id="report"></div>

<script type="module">
import * as A from '../../src/audio/index.js';

const $ = (id) => document.getElementById(id);
const btn = (parent, label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { A.unlock(); fn(b); }; $(parent).appendChild(b); return b; };

for (const id of A.tracks) { const m = A.trackMeta(id); btn('music', id, (b) => { A.playMusic(id); document.querySelectorAll('#music button').forEach((x) => x.classList.toggle('on', x === b)); }).title = `${m.name} - ${m.tempo} bpm ${m.key} ${m.mode}, loop ${m.loopSec.toFixed(1)}s`; }
for (const id of A.sfxList) btn('sfx', id, () => A.playSfx(id));
for (const v of A.voiceList) btn('voices', v, () => { let i = 0; const t = setInterval(() => { A.blip(v); if (++i >= 8) clearInterval(t); }, 85); });
for (const s of ['grass', 'dirt', 'stone', 'wood', 'sand', 'snow', 'carpet', 'water']) {
  btn('steps', s, () => { let i = 0; const t = setInterval(() => { A.footstep(s); if (++i >= 4) clearInterval(t); }, 380); });
  btn('steps', s + ' (run)', () => { let i = 0; const t = setInterval(() => { A.footstep(s, { run: true }); if (++i >= 6) clearInterval(t); }, 210); });
}
const presets = {
  'brook spring day': { area: 'brook_lane', weather: 'sunny', season: 'spring', night: false },
  'square summer night': { area: 'town_square', weather: 'sunny', season: 'summer', night: true },
  'harbor day': { area: 'harbor', weather: 'cloudy', season: 'summer', night: false },
  'woods rain': { area: 'whispering_woods', weather: 'rain', season: 'autumn', night: false },
  'hill winter': { area: 'starview_hill', weather: 'snow', season: 'winter', night: true },
  'inn rain': { area: 'inn', weather: 'rain', season: 'autumn', night: false },
  'cottage winter': { area: 'cottage', weather: 'sunny', season: 'winter', night: false },
  off: { area: 'none' },
};
for (const [k, v] of Object.entries(presets)) btn('ambpresets', k, () => A.setAmbience(v));
$('unlock').onclick = () => { A.unlock(); $('status').textContent = JSON.stringify(A.stats()); };
$('stop').onclick = () => A.stopMusic();
let muted = false;
$('mute').onclick = (e) => { muted = !muted; A.setMuted(muted); e.target.classList.toggle('on', muted); };
for (const k of ['master', 'music', 'sfx', 'ambience']) $('v-' + k).oninput = (e) => A.setVolume({ [k]: +e.target.value });

// level visualiser
const cv = $('viz'), g2 = cv.getContext('2d');
const data = new Uint8Array(1024);
(function draw() {
  requestAnimationFrame(draw);
  const an = A.getAnalyser();
  g2.fillStyle = '#14121a'; g2.fillRect(0, 0, cv.width, cv.height);
  if (!an) return;
  an.getByteTimeDomainData(data);
  let peak = 0; g2.strokeStyle = '#f2b45a'; g2.beginPath();
  for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; peak = Math.max(peak, Math.abs(v)); const x = (i / data.length) * cv.width, y = cv.height / 2 + v * cv.height * 0.45; i ? g2.lineTo(x, y) : g2.moveTo(x, y); }
  g2.stroke();
  g2.fillStyle = peak > 0.95 ? '#ef7a7a' : '#7fd49a'; g2.fillRect(0, cv.height - 6, peak * cv.width, 6);
})();

// ---- offline analysis ----
function verdict(kind, r) {
  const issues = [];
  if (r.nan) issues.push('NaN');
  if (r.peak >= 0.99) issues.push('peak');
  if (kind === 'track') {
    if (r.rmsDb < -32 || r.rmsDb > -12) issues.push('rms');
    if (r.silentRatio > 0.15) issues.push('silent');
    if (r.seam && !r.seam.ok) issues.push('seam');
  } else if (kind === 'sfx' || kind === 'voice') { if (r.peak < 0.02) issues.push('silent'); }
  else if (r.peak < 0.005) issues.push('silent');
  return issues;
}
async function runAll() {
  const report = { tracks: {}, sfx: {}, voices: {}, ambience: {}, failures: [], startedAt: Date.now() };
  const jobs = [
    ...A.tracks.map((id) => ['tracks', 'track', id, id]),
    ...A.sfxList.map((id) => ['sfx', 'sfx', id, id]),
    ...A.voiceList.map((id) => ['voices', 'voice', id, 'voice:' + id]),
    ...A.ambienceList.map((id) => ['ambience', 'ambience', id, 'ambience:' + id]),
  ];
  for (const id of ['step_carpet', 'step_water']) jobs.push(['sfx', 'sfx', id, id]); // footstep-only surfaces
  let n = 0, next = 0;
  // OfflineAudioContexts render on their own threads: run a few at a time. Analysis rate is 16 kHz (enough for levels/seams).
  const worker = async () => {
    while (next < jobs.length) {
      const [bucket, kind, id, key] = jobs[next++];
      $('progress').textContent = `${++n}/${jobs.length} ${id}`;
      try {
        const r = await A.renderOffline(key, undefined, { sampleRate: 16000 });
        if (!r) throw new Error('OfflineAudioContext unavailable');
        if (kind === 'track') Object.assign(r, A.trackMeta(id));
        r.issues = verdict(kind, r);
        report[bucket][id] = r;
        if (r.issues.length) report.failures.push(`${bucket}/${id}: ${r.issues.join(',')}`);
      } catch (e) { report[bucket][id] = { error: String(e && e.message || e) }; report.failures.push(`${bucket}/${id}: error ${e && e.message}`); }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  for (const [bucket, , id] of jobs) { const v = report[bucket][id]; delete report[bucket][id]; report[bucket][id] = v; } // canonical order
  // distinctness: two effects are "too similar" when their level envelopes and dominant frequency nearly match
  report.similarSfx = [];
  const ids = Object.keys(report.sfx).filter((k) => report.sfx[k].env);
  for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
    const a = report.sfx[ids[i]], b = report.sfx[ids[j]];
    let d = 0; for (let k = 0; k < 30; k++) d += Math.abs(a.env[k] - b.env[k]); d /= 30;
    let fd = 0, fc = 0; // mean octave distance between the two brightness contours where both are active; bins active in only one count as 1 octave
    for (let k = 0; k < 30; k++) { const x = a.zcrBins[k], y = b.zcrBins[k]; if (x && y) { fd += Math.abs(Math.log2(x / y)); fc++; } else if (x || y) { fd += 1; fc++; } }
    fd = fc ? fd / fc : 0;
    if (d < 4 && fd < 0.25) report.similarSfx.push(`${ids[i]} ~ ${ids[j]} (env ${d.toFixed(1)} dB, contour ${fd.toFixed(2)} oct)`);
  }
  for (const s of report.similarSfx) report.failures.push('similar: ' + s);
  report.ms = Date.now() - report.startedAt;
  return report;
}
function show(report) {
  let h = '<table><tr><th>track</th><th>bpm</th><th>key</th><th>loop s</th><th>rms dB</th><th>peak</th><th>silent</th><th>seam dB</th><th>issues</th></tr>';
  for (const [id, r] of Object.entries(report.tracks)) h += `<tr><td>${id}</td><td>${r.tempo}</td><td>${r.key} ${r.mode}</td><td>${r.loopSec && r.loopSec.toFixed(1)}</td><td>${r.rmsDb}</td><td>${r.peak}</td><td>${r.silentRatio}</td><td>${r.seam ? r.seam.deltaDb : ''}</td><td class="${r.issues && r.issues.length ? 'bad' : 'ok'}">${r.error || (r.issues && r.issues.join(',')) || 'ok'}</td></tr>`;
  h += '</table><table><tr><th>other</th><th>peak</th><th>active rms dB</th><th>issues</th></tr>';
  for (const b of ['sfx', 'voices', 'ambience']) for (const [id, r] of Object.entries(report[b])) h += `<tr><td>${b}/${id}</td><td>${r.peak}</td><td>${r.activeRmsDb}</td><td class="${r.issues && r.issues.length ? 'bad' : 'ok'}">${r.error || (r.issues && r.issues.join(',')) || 'ok'}</td></tr>`;
  $('report').innerHTML = h + '</table>';
}
$('runtest').onclick = async () => { const r = await runAll(); window.__audioReport = r; show(r); $('progress').textContent = `done in ${(r.ms / 1000).toFixed(1)}s, ${r.failures.length} issue(s)`; };
if (new URLSearchParams(location.search).get('autotest') === '1') {
  runAll().then((r) => { window.__audioReport = r; show(r); window.__ready = true; }).catch((e) => { window.__audioReport = { fatal: String(e) }; window.__ready = true; });
}
</script>
</body>
</html>
